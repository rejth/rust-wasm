# You must change these to your own details.
[package]
name = "wgpu-sandbox"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wgpu-sandbox"
path = "src/main.rs"

[profile.release]
# This makes the compiled code faster and smaller, but it makes compiling slower, so it's only enabled in release mode.
lto = true

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "28.0"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "28.0", features = ["webgl"] }
# The `wasm-bindgen` crate provides the bare minimum functionality needed to interact with JavaScript.
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.30"
# The `web-sys` crate allows you to interact with the various browser APIs, like the DOM.
web-sys = { version = "0.3.69", features = ["Document", "Window", "Element"] }

# These crates are used for running unit tests.
[dev-dependencies]
wasm-bindgen-test = "0.3"
futures = "0.3"
js-sys = "0.3.83"
wasm-bindgen-futures = "0.4"
