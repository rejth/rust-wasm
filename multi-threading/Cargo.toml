# You must change these to your own details.
[package]
name = "multi-threading"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
# This makes the compiled code faster and smaller, but it makes compiling slower,
# so it's only enabled in release mode.
lto = true

[dependencies]
# The `wasm-bindgen` crate provides the bare minimum functionality needed to interact with JavaScript.
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.83"
# Rayon for parallel iterators
rayon = "1.10"
wasm-bindgen-rayon = "1.2"

# Color utilities
hsl = "0.1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

# The `web-sys` crate allows you to interact with the various browser APIs, like the DOM.
[dependencies.web-sys]
version = "0.3.83"
features = ["console"]

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so it's only enabled
# in debug mode.
[target."cfg(debug_assertions)".dependencies]
console_error_panic_hook = "0.1"

# These crates are used for running unit tests.
[dev-dependencies]
wasm-bindgen-test = "0.3"
futures = "0.3"
js-sys = "0.3.83"
wasm-bindgen-futures = "0.4"
